name: Go Rubika Bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Install dependencies
      run: |
        go mod download
        go get github.com/AbolfazlZarei-dev/ParsRubika-bot-go/v2

    - name: Build
      run: go build -v ./...

    - name: Run
      run: go run main.go
